# X-Forwarded-Proto: Traefik -> nginx (http); для Next нужен публичный https.
map $http_x_forwarded_proto $landing_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# --- SPA + API: только app-поддомен и локальная отладка ---
server {
    listen 80;
    server_name app.altapens.ru altapens-web.localhost.sslip.io localhost 127.0.0.1 ::1 ~^192\.168\.[0-9]+\.[0-9]+$ ~^10\.[0-9]+\.[0-9]+\.[0-9]+$;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Всё остальное на этом ingress (apex, www, иной Host от прокси) -> Next.js ---
# Раньше был отдельный server_name altapens.ru + default_server с 503: любой «нестрогий» Host
# попадал в 503 (индекс, favicon). Теперь fallback = лендинг, а не ошибка.
server {
    listen 80 default_server;
    server_name _;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://landing:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $landing_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
