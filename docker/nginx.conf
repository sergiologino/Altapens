# Важно: нельзя оставлять server_name localhost без catch-all — иначе этот блок становится default_server
# и отдаёт SPA при ЛЮБОМ Host (в т.ч. altapens.ru), если Traefik ошибочно проксирует на web.
# SPA только для поддомена приложения и для локального compose (localhost:3080).
server {
    listen 80;
    # regex — доступ к web по http://<LAN-IP>:3080 (без {} — иначе nginx парсер ломается)
    server_name app.altapens.ru localhost 127.0.0.1 ::1 ~^192\.168\.[0-9]+\.[0-9]+$ ~^10\.[0-9]+\.[0-9]+\.[0-9]+$;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # API → Spring Boot (браузер ходит на тот же host:port)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI / Swagger через тот же вход (удобно с телефона по LAN — замените server_name при необходимости)
    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Всё, что не app.altapens.ru / localhost — не отдаём SPA (закрываем соединение).
# Если видите пустую страницу/обрыв — маршрутизация Traefik/Coolify ведёт apex на web вместо landing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
