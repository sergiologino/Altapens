services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altacare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d altacare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/altacare
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_SAME_ORIGIN: "true"
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - traefik.enable=true
      # Coolify Traefik: entrypoints http (:80) и https (:443). Только http — HTTPS не матчится → ERR_SSL / редирект на http / чужой бэкенд.
      - traefik.http.middlewares.pens-force-https.redirectscheme.scheme=https
      - traefik.http.middlewares.pens-force-https.redirectscheme.permanent=true
      # SPA app.altapens.ru — HTTP → редирект на HTTPS
      - traefik.http.routers.pens-app-http.rule=Host(`app.altapens.ru`)
      - traefik.http.routers.pens-app-http.entrypoints=http
      - traefik.http.routers.pens-app-http.middlewares=pens-force-https
      - traefik.http.routers.pens-app-http.service=pens-app
      # SPA — HTTPS + Let's Encrypt (resolver имя как у прокси Coolify)
      - traefik.http.routers.pens-app-https.rule=Host(`app.altapens.ru`)
      - traefik.http.routers.pens-app-https.entrypoints=https
      - traefik.http.routers.pens-app-https.tls=true
      - traefik.http.routers.pens-app-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-app-https.service=pens-app
      - traefik.http.services.pens-app.loadbalancer.server.port=80

  # SSR-лендинг: apex + www; отдельные роутеры для https (см. web).
  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://altapens.ru}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.altapens.ru}
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.pens-landing-http.rule=Host(`altapens.ru`) || Host(`www.altapens.ru`)'
      - traefik.http.routers.pens-landing-http.entrypoints=http
      - traefik.http.routers.pens-landing-http.middlewares=pens-force-https
      - traefik.http.routers.pens-landing-http.service=pens-landing
      - 'traefik.http.routers.pens-landing-https.rule=Host(`altapens.ru`) || Host(`www.altapens.ru`)'
      - traefik.http.routers.pens-landing-https.entrypoints=https
      - traefik.http.routers.pens-landing-https.tls=true
      - traefik.http.routers.pens-landing-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-landing-https.service=pens-landing
      - traefik.http.services.pens-landing.loadbalancer.server.port=3000

volumes:
  pens_pgdata: