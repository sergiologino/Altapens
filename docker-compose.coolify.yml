services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altacare
      POSTGRES_USER: postgres
      # Один и тот же пароль в Coolify для postgres и backend (DB_PASSWORD). POSTGRES_PASSWORD читается только при ПЕРВОМ создании тома; смена env не меняет пароль в уже существующем pens_pgdata — см. комментарий у backend.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - pens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d altacare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/altacare
      DB_USERNAME: postgres
      # Должен совпадать с паролем внутри Postgres. Если меняли POSTGRES_PASSWORD после первого деплоя: либо ALTER USER в БД под старым паролем, либо удалить том pens_pgdata (потеря данных).
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_SAME_ORIGIN: "true"
    depends_on:
      backend:
        condition: service_started
      landing:
        condition: service_started
    expose:
      - "80"
    labels:
      - traefik.enable=true
      # Traefik -> web:80; nginx по Host отдаёт SPA (app) или лендинг (apex/www).
      # Два HTTPS-роутера: отдельный tls.domains для app — иначе ACME/браузер часто ломаются на поддомене при одном multi-SAN.
      - 'traefik.http.routers.pens-site-https.rule=Host(`altapens.ru`) || Host(`www.altapens.ru`)'
      - traefik.http.routers.pens-site-https.entrypoints=https
      - traefik.http.routers.pens-site-https.tls=true
      - traefik.http.routers.pens-site-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-site-https.tls.domains[0].main=altapens.ru
      - traefik.http.routers.pens-site-https.tls.domains[0].sans=www.altapens.ru
      - traefik.http.routers.pens-site-https.service=pens-app
      - traefik.http.routers.pens-app-https.rule=Host(`app.altapens.ru`)
      - traefik.http.routers.pens-app-https.entrypoints=https
      - traefik.http.routers.pens-app-https.tls=true
      - traefik.http.routers.pens-app-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-app-https.tls.domains[0].main=app.altapens.ru
      - traefik.http.routers.pens-app-https.service=pens-app
      - traefik.http.services.pens-app.loadbalancer.server.port=80

  # SSR-лендинг: только внутри сети compose (nginx на web проксирует сюда для apex/www).
  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://altapens.ru}
        # Ссылка на SPA; если в DNS нет A/AAAA для app — браузер не откроет поддомен. См. apps/landing/.env.example
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.altapens.ru}
    expose:
      - "3000"
volumes:
  pens_pgdata: