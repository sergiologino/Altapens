services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altacare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d altacare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/altacare
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_SAME_ORIGIN: "true"
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - traefik.enable=true
      # Только https: отдельные HTTP-роутеры с redirectScheme давали второй редирект и Location на *.localhost.sslip.io (превью Coolify).
      # Редирект http→https обычно уже на прокси Coolify; иначе включите Force HTTPS в настройках proxy.
      - traefik.http.routers.pens-app-https.rule=Host(`app.altapens.ru`)
      - traefik.http.routers.pens-app-https.entrypoints=https
      # Ниже приоритета лендинга: если в Coolify к apex случайно привязан web, поднимите лендинг (см. комментарий внизу файла).
      - traefik.http.routers.pens-app-https.priority=50
      - traefik.http.routers.pens-app-https.tls=true
      - traefik.http.routers.pens-app-https.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-app-https.service=pens-app
      - traefik.http.services.pens-app.loadbalancer.server.port=80

  # SSR-лендинг: apex + www
  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://altapens.ru}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.altapens.ru}
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      # Два роутера: явный SAN для www в сертификате + приоритет выше любых авто-правил Coolify на сервисе web.
      - traefik.http.routers.pens-landing-root.rule=Host(`altapens.ru`)
      - traefik.http.routers.pens-landing-root.entrypoints=https
      - traefik.http.routers.pens-landing-root.priority=999999
      - traefik.http.routers.pens-landing-root.tls=true
      - traefik.http.routers.pens-landing-root.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-landing-root.tls.domains[0].main=altapens.ru
      - traefik.http.routers.pens-landing-root.tls.domains[0].sans=www.altapens.ru
      - traefik.http.routers.pens-landing-root.service=pens-landing
      - traefik.http.routers.pens-landing-www.rule=Host(`www.altapens.ru`)
      - traefik.http.routers.pens-landing-www.entrypoints=https
      - traefik.http.routers.pens-landing-www.priority=999999
      - traefik.http.routers.pens-landing-www.tls=true
      - traefik.http.routers.pens-landing-www.tls.certresolver=letsencrypt
      - traefik.http.routers.pens-landing-www.tls.domains[0].main=altapens.ru
      - traefik.http.routers.pens-landing-www.tls.domains[0].sans=www.altapens.ru
      - traefik.http.routers.pens-landing-www.service=pens-landing
      - traefik.http.services.pens-landing.loadbalancer.server.port=3000

# Если apex всё ещё открывает SPA (/welcome): в Coolify уберите домен altapens.ru с сервиса web и оставьте только app.altapens.ru.
volumes:
  pens_pgdata: