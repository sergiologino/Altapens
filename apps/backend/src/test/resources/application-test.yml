spring:
  datasource:
    url: jdbc:h2:mem:altacare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  sql:
    init:
      mode: never

app:
  security:
    jwt-secret: test-secret-test-secret-test-secret
    issuer: altacare-backend-test
    access-token-ttl: PT12H
