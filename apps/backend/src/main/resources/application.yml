spring:
  application:
    name: altacare-backend
  docker:
    compose:
      # Включается только в профиле `dev` (см. application-dev.yml), чтобы `local` и тесты не трогали Docker.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/altacare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

app:
  # Разрешённые Origin для браузера (не используйте суффикс :* у домена без порта — Origin будет https://altapens.ru).
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://altapens.ru"
      - "https://www.altapens.ru"
      - "https://app.altapens.ru"
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    issuer: altacare-backend
    access-token-ttl: PT12H
  # Вызовы noteapp-ai-integration (заголовок X-API-Key = api-key клиента из БД интеграции).
  ai-integration:
    base-url: ${AI_INTEGRATION_BASE_URL:http://localhost:8091}
    api-key: ${AI_INTEGRATION_API_KEY:}
    connect-timeout-ms: ${AI_INTEGRATION_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_INTEGRATION_READ_TIMEOUT_MS:120000}
    default-chat-network: ${AI_INTEGRATION_DEFAULT_NETWORK:}
    default-speech-synthesis-network: ${AI_INTEGRATION_DEFAULT_SPEECH_NETWORK:}
    request-tts-from-integration: ${AI_INTEGRATION_REQUEST_TTS:false}
    # Привязка клиента к user_accounts интеграции (POST .../assign-user), как у других приложений; нужен пароль admin.
    admin-username: ${AI_INTEGRATION_ADMIN_USERNAME:admin}
    admin-password: ${AI_INTEGRATION_ADMIN_PASSWORD:}
    owner-email: ${AI_INTEGRATION_OWNER_EMAIL:admin@example.com}
  # Нейро-озвучка через noteapp-ai-integration (speech_synthesis → OpenAI TTS в интеграции). Ключ OpenAI только там.
  tts:
    openai:
      model: ${ALTAPENS_TTS_MODEL:${OPENAI_TTS_MODEL:}}
      voice: ${ALTAPENS_TTS_VOICE:${OPENAI_TTS_VOICE:nova}}
  # FCM: отправка push (пропущенный приём и др.). Включайте только при наличии ключа сервисного аккаунта Firebase.
  push:
    fcm:
      enabled: ${APP_PUSH_FCM_ENABLED:false}
      missed-check-interval-ms: ${APP_PUSH_FCM_MISSED_CHECK_INTERVAL_MS:120000}
      service-account-json-path: ${APP_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH:}
  # ЮKassa: донаты (при enabled=false создаётся демо-платёж без вызова API)
  yookassa:
    enabled: ${APP_YOOKASSA_ENABLED:false}
    shop-id: ${APP_YOOKASSA_SHOP_ID:}
    secret-key: ${APP_YOOKASSA_SECRET_KEY:}
    public-app-url: ${APP_PUBLIC_WEB_URL:http://localhost:5173}
