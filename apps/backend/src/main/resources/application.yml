spring:
  application:
    name: altacare-backend
  docker:
    compose:
      # Включается только в профиле `dev` (см. application-dev.yml), чтобы `local` и тесты не трогали Docker.
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/altacare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    issuer: altacare-backend
    access-token-ttl: PT12H
